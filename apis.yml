name: Bounty Hunter
description: 'Bounty Hunter (獎金獵人) is Taiwan''s largest creative-competition platform, founded
  in 2011 to help young creators discover and enter contests. It aggregates and curates design,
  illustration, photography, short-film, writing, music, business-planning, programming, and
  academic competitions from Taiwan and around the world for its several-hundred-thousand registered
  creator members. Through its Contest Builder (contest.bhuntr.com) and brand-services arm
  (desk.bhuntr.com) it also runs sponsored competitions for clients including Google, Microsoft,
  Lexus, McDonald''s, and E.SUN. The company established a U.S. headquarters in 2014 and is backed
  by 500 Startups (500 Global) and Silicon Valley angel investors. It exposes no documented public
  developer API; api.bhuntr.com is an undocumented first-party backend.'
